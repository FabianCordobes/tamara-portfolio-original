name: Temporary compatibility update lockfile

on:
  push:
    branches: [chore/compatible-dependency-updates-20261031]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve pinned dependencies into npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-compat-lock.yml
          git add package-lock.json
          git commit -m "chore: refresh locked compatible dependencies"
          git push origin HEAD:chore/compatible-dependency-updates-20261031
