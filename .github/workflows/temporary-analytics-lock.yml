name: Temporary Analytics lockfile generation

on:
  push:
    branches: [feat/conversion-seo-analytics-20261031]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve pinned analytics dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-analytics-lock.yml
          git add package-lock.json
          git commit -m "chore(analytics): lock Vercel Analytics dependency"
          git push origin HEAD:feat/conversion-seo-analytics-20261031
