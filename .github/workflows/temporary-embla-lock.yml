name: Temporary Embla lockfile generation

on:
  push:
    branches: [feat/music-gallery-autoplay-10-photos]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-embla-lock.yml
          git add package-lock.json
          git commit -m "chore(music): lock Embla 8.6.0 dependencies"
          git push origin HEAD:feat/music-gallery-autoplay-10-photos
